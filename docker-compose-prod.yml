version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        IMAGE_TAG: rp_skeleton:dev
    image: rp_skeleton:prod
    ports:
      - "8001:8000"
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
