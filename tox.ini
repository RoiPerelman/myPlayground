[tox]
envlist = format,lint,type,tests,coverage
isolated_build = true
skip_missing_interpreters = true

[testenv]
basepython = python3.11
setenv =
    PYTHONDONTWRITEBYTECODE=1
    PYTHONUNBUFFERED=1
passenv = PYTHONPATH

[testenv:format]
description = Apply Ruff formatting and import sorting (I)
skip_install = true
deps = ruff
commands =
    ruff format .
    ruff check --fix .

[testenv:lint]
description = Ruff formatting (check) and lint
skip_install = true
deps = ruff
commands =
    ruff format --check .
    ruff check .

[testenv:type]
description = Pyright strict type checking
skip_install = true
deps = pyright
commands = pyright

[testenv:tests]
description = Run test suite
extras = dev
commands = pytest -q

[testenv:coverage]
description = Run test suite with coverage enforcement (>=95%)
extras = dev
commands = pytest --cov=rp_skeleton --cov-report=term-missing --cov-fail-under=95