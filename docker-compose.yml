version: "3.9"

services:
  rp_skeleton:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_TAG: debian:bookworm-slim
    image: rp_skeleton:dev
    ports:
      - "8000:8000"
    volumes:
      - .:/venv/lib/python3.11/site-packages/rp_skeleton
    environment:
      UVICORN_LOG_LEVEL: debug
    command: ["uvicorn", "rp_skeleton.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:17.6-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: rp_dbname
      POSTGRES_PASSWORD: test123
    volumes:
      - /var/lib/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:

      - 8080:8080

